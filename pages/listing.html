<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Published Pages ({{count}})</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #86868b;
      --secondary: #6e6e73;
      --border: #d2d2d7;
      --hairline: rgba(0, 0, 0, 0.06);
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --focus: rgba(0, 113, 227, 0.18);
      --chip: #f5f5f7;
      --danger: #de071c;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 64px 24px 96px; color: var(--text); background: var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    .hero { text-align: center; margin-bottom: 36px; }
    .eyebrow { margin: 0 0 10px; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: -0.01em; }
    h1 { margin: 0 0 18px; font-size: clamp(2.5rem, 6vw, 3.5rem); font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; }

    .count-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 980px; background: var(--surface); border: 1px solid var(--hairline); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03); font-size: 14px; color: var(--secondary); }
    .count-badge #count { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .count-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .search { position: relative; flex: 1; min-width: 0; }
    .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
    .search input { width: 100%; height: 48px; padding: 0 16px 0 44px; font-family: inherit; font-size: 15px; letter-spacing: -0.01em; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; appearance: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
    .search input::placeholder { color: var(--muted); }
    .search input::-webkit-search-cancel-button { cursor: pointer; }
    .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--focus); }

    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex-shrink: 0; height: 48px; padding: 0 24px; border-radius: 980px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; text-decoration: none; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); transition: background 0.2s ease, transform 0.1s ease; }
    .button:hover { background: var(--accent-hover); }
    .button:active { transform: scale(0.98); }
    .button svg { width: 17px; height: 17px; }
    .button.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--border); box-shadow: none; }
    .button.secondary:hover { background: var(--chip); }

    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    [hidden] { display: none !important; }
    /* Each row is one card. The page link fills the left side and the actions
       live inside the same surface, so nothing floats loose beside it. */
    .row { position: relative; display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow); transition: border-color 0.2s ease, box-shadow 0.2s ease; }
    .row:hover { border-color: rgba(0, 0, 0, 0.12); box-shadow: var(--shadow-hover); }
    .row-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding: 16px 10px 16px 20px; border-radius: 15px; text-decoration: none; color: inherit; }
    .row-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
    .meta { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .title { font-size: 17px; font-weight: 600; letter-spacing: -0.022em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slug { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-end { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .date { flex-shrink: 0; padding: 5px 10px; border-radius: 8px; background: var(--chip); color: var(--secondary); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .usage { flex-shrink: 0; padding: 5px 10px; border-radius: 8px; background: var(--chip); color: var(--secondary); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chevron { flex-shrink: 0; width: 16px; height: 16px; color: #c7c7cc; transition: color 0.2s ease, transform 0.2s ease; }
    .row:hover .chevron { color: var(--muted); transform: translateX(2px); }

    /* Quiet icon actions, grouped on the right of the card. */
    .row-actions { display: flex; align-items: center; gap: 2px; padding-right: 10px; }
    .action { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .action svg { display: block; }
    .action:hover { background: rgba(0, 0, 0, 0.05); color: var(--text); }
    .action:active { background: rgba(0, 0, 0, 0.09); }
    .action:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-tag:hover, .action-copy:hover { color: var(--accent); background: rgba(0, 113, 227, 0.08); }
    .action-copy .icon-check { display: none; }
    .action-copy.copied { color: #248a3d; background: rgba(52, 199, 89, 0.12); }
    .action-copy.copied .icon-copy { display: none; }
    .action-copy.copied .icon-check { display: block; }
    .action-delete { position: relative; margin-left: 8px; }
    .action-delete::before { content: ""; position: absolute; left: -7px; top: 50%; transform: translateY(-50%); width: 1px; height: 20px; background: var(--border); }
    .action-delete:hover { color: var(--danger); background: rgba(222, 7, 28, 0.08); }

    /* Faint at rest so the row reads as one card; full strength on hover/focus. */
    @media (hover: hover) and (pointer: fine) {
      .row-actions { opacity: 0.4; transition: opacity 0.18s ease; }
      .row:hover .row-actions, .row:focus-within .row-actions { opacity: 1; }
    }

    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .tag { padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--secondary); font-size: 11px; font-weight: 500; letter-spacing: 0; }

    .button:focus-visible, .action:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }

    .empty { padding: 64px 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px; font-size: 15px; }
    #status { color: var(--danger); font-size: 14px; margin: 0 0 12px; text-align: center; }
    #status:empty { display: none; }

    .dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: none; border-radius: 20px; background: var(--surface); color: var(--text); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25); }
    .dialog::backdrop { background: rgba(0, 0, 0, 0.28); backdrop-filter: blur(4px); }
    .dialog form { display: flex; flex-direction: column; gap: 12px; padding: 24px; }
    .dialog h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .dialog-page { margin: 0; color: var(--muted); font-size: 13px; }
    .dialog label { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .dialog input { height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--chip); color: var(--text); font-family: inherit; font-size: 15px; letter-spacing: -0.01em; transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
    .dialog input:focus { outline: none; background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--focus); }
    .dialog-hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .dialog-error { margin: 0; color: var(--danger); font-size: 13px; }
    .dialog-error:empty { display: none; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .dialog-actions button { height: 40px; padding: 0 18px; border-radius: 980px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
    .dialog-cancel { border: 1px solid var(--hairline); background: var(--chip); color: var(--text); }
    .dialog-cancel:hover { background: #ebebef; }
    .dialog-save { border: none; background: var(--accent); color: #fff; }
    .dialog-save:hover { background: var(--accent-hover); }
    .dialog-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .dialog-actions button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus); }

    @media (max-width: 640px) {
      body { padding: 44px 18px 72px; }
      .hero { margin-bottom: 28px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .button { width: 100%; }
      .row-link { padding: 14px 6px 14px 16px; gap: 12px; }
      .row-end { gap: 8px; }
      .chevron { display: none; }
      .row-actions { padding-right: 6px; }
      .action { width: 40px; height: 40px; }
      .action-delete { margin-left: 6px; }
      .action-delete::before { left: -6px; }
      .dialog form { padding: 20px; }
    }

    /* Very narrow screens: drop the date badge so the title keeps its room. */
    @media (max-width: 480px) {
      .date { display: none; }
      .usage { font-size: 11px; padding: 4px 8px; }
      .row-link { padding-left: 14px; gap: 10px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <p class="eyebrow">HTML Bin</p>
    <h1>Published Pages</h1>
    <div class="count-badge" aria-live="polite"><span class="count-dot" aria-hidden="true"></span><span id="count">{{count}}</span> <span id="pagesLabel">{{pagesLabel}}</span></div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search by title, URL, or tag" autocomplete="off" spellcheck="false" aria-label="Search pages by title, URL, or tag" />
    </div>
    <a class="button secondary" href="/prompt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      Generate with AI
    </a>
    <a class="button" href="/submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Submit new page
    </a>
  </div>

  <div id="status" role="status"></div>
  <div id="pages">{{list}}</div>
  <div id="noResults" class="empty" hidden>No pages match your search.</div>

  <dialog id="tagDialog" class="dialog" aria-labelledby="tagDialogTitle">
    <form id="tagForm">
      <h2 id="tagDialogTitle">Edit tags</h2>
      <p class="dialog-page" id="tagPage"></p>
      <label for="tagInput">Tags</label>
      <input id="tagInput" type="text" placeholder="design, work, demo" autocomplete="off" spellcheck="false" />
      <p class="dialog-hint">Separate tags with commas. Leave empty to remove all tags.</p>
      <p class="dialog-error" id="tagError" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="dialog-cancel" id="tagCancel">Cancel</button>
        <button type="submit" class="dialog-save" id="tagSave">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      var pages = document.getElementById("pages");
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");
      var noResults = document.getElementById("noResults");
      var search = document.getElementById("search");
      var status = document.getElementById("status");
      var count = document.getElementById("count");
      var pagesLabel = document.getElementById("pagesLabel");
      var tagDialog = document.getElementById("tagDialog");
      var tagForm = document.getElementById("tagForm");
      var tagPage = document.getElementById("tagPage");
      var tagInput = document.getElementById("tagInput");
      var tagError = document.getElementById("tagError");
      var tagCancel = document.getElementById("tagCancel");
      var tagSave = document.getElementById("tagSave");
      var activeTagRow = null;

      function updateCount() {
        var rows = list.querySelectorAll("[data-row]");
        var total = rows.length;
        var visible = 0;

        for (var i = 0; i < rows.length; i++) {
          if (!rows[i].hidden) visible++;
        }

        var query = search.value.trim();
        count.textContent = query && visible !== total
          ? visible + " of " + total
          : String(total);
        pagesLabel.textContent =
          query && visible !== total
            ? "pages"
            : total === 1 ? "page" : "pages";

        list.hidden = total === 0;
        empty.hidden = total !== 0;
        noResults.hidden = !(total > 0 && visible === 0);
      }

      // Cached per row; invalidated when tags change so search stays accurate.
      function searchText(row) {
        if (row.searchText) return row.searchText;

        var tags = tagsFromRow(row);
        row.searchText = (
          row.getAttribute("data-title") +
          " " +
          row.getAttribute("data-slug") +
          " " +
          tags.join(" ")
        ).toLowerCase();

        return row.searchText;
      }

      function applyFilter() {
        var query = search.value.trim().toLowerCase();
        var rows = list.querySelectorAll("[data-row]");

        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          row.hidden = query !== "" && searchText(row).indexOf(query) === -1;
        }

        updateCount();
      }

      // Render dates in the visitor's timezone instead of the server's UTC fallback.
      function localizeDates() {
        var dates = pages.querySelectorAll("time[data-date]");
        for (var i = 0; i < dates.length; i++) {
          var date = new Date(dates[i].getAttribute("datetime"));
          if (isNaN(date.getTime())) continue;
          dates[i].textContent = date.toLocaleDateString(undefined, {
            year: "numeric",
            month: "short",
            day: "numeric"
          });
        }
      }

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch (e) {
            // Fall through to the legacy path when the clipboard is blocked.
          }
        }

        return new Promise(function (resolve, reject) {
          var textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.top = "0";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();

          try {
            document.execCommand("copy")
              ? resolve()
              : reject(new Error("Copy failed"));
          } catch (error) {
            reject(error);
          } finally {
            document.body.removeChild(textarea);
          }
        });
      }

      async function copyLink(button) {
        var url = button.getAttribute("data-url");
        if (!url) return;

        if (!button.dataset.label) {
          button.dataset.label = button.getAttribute("aria-label") || "Copy link";
        }

        try {
          await copyText(url);
          status.textContent = "";
          button.classList.add("copied");
          button.setAttribute("aria-label", "Link copied");

          clearTimeout(button.copyTimer);
          button.copyTimer = setTimeout(function () {
            button.classList.remove("copied");
            button.setAttribute("aria-label", button.dataset.label);
          }, 1600);
        } catch (error) {
          status.textContent = "Could not copy the link.";
        }
      }

      function tagsFromRow(row) {
        try {
          var parsed = JSON.parse(row.getAttribute("data-tags") || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function renderTags(row, tags) {
        row.setAttribute("data-tags", JSON.stringify(tags));
        row.searchText = null;
        var container = row.querySelector("[data-tags-container]");
        if (!container) return;

        container.textContent = "";
        for (var i = 0; i < tags.length; i++) {
          var chip = document.createElement("span");
          chip.className = "tag";
          chip.textContent = tags[i];
          container.appendChild(chip);
        }

        container.hidden = tags.length === 0;
      }

      function renderUpdatedAt(row, iso) {
        if (!iso) return;

        var date = new Date(iso);
        if (isNaN(date.getTime())) return;

        var time = row.querySelector("time[data-date]");
        if (!time) return;

        time.setAttribute("datetime", iso);
        time.textContent = date.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric"
        });
      }

      function normalizeTagInput(value) {
        var parts = value.split(",");
        var tags = [];
        var seen = Object.create(null);

        for (var i = 0; i < parts.length; i++) {
          var tag = parts[i].trim();
          if (!tag) continue;

          var key = tag.toLowerCase();
          if (seen[key]) continue;

          seen[key] = true;
          tags.push(tag);
        }

        return tags;
      }

      function openTagEditor(button) {
        var row = button.closest("[data-row]");
        if (!row || tagDialog.open) return;

        activeTagRow = row;
        tagPage.textContent =
          row.getAttribute("data-title") || row.getAttribute("data-slug");
        tagInput.value = tagsFromRow(row).join(", ");
        tagError.textContent = "";

        tagDialog.showModal();
        tagInput.focus();
        tagInput.select();
      }

      tagForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!activeTagRow) return;

        var key = activeTagRow.getAttribute("data-slug");
        var tags = normalizeTagInput(tagInput.value);

        tagError.textContent = "";
        tagSave.disabled = true;

        try {
          var response = await fetch("/" + encodeURIComponent(key), {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tags: tags })
          });

          if (response.status === 401) {
            tagError.textContent = "Unauthorized. Reload the page to sign in again.";
            return;
          }

          var data = {};
          try {
            data = await response.json();
          } catch (e) {}

          if (!response.ok) {
            tagError.textContent = data.error || "Update failed with status " + response.status;
            return;
          }

          renderTags(activeTagRow, Array.isArray(data.tags) ? data.tags : tags);
          renderUpdatedAt(activeTagRow, data.updatedAt);
          tagDialog.close();
          applyFilter();
        } catch (error) {
          tagError.textContent = "Network error: " + error.message;
        } finally {
          tagSave.disabled = false;
        }
      });

      tagCancel.addEventListener("click", function () {
        tagDialog.close();
      });

      tagDialog.addEventListener("close", function () {
        activeTagRow = null;
      });

      // Clicking the backdrop closes the dialog.
      tagDialog.addEventListener("click", function (event) {
        if (event.target === tagDialog) tagDialog.close();
      });

      search.addEventListener("input", applyFilter);

      pages.addEventListener("click", async function (event) {
        var tagButton = event.target.closest("[data-edit-tags]");
        if (tagButton) {
          event.preventDefault();
          openTagEditor(tagButton);
          return;
        }

        var copyButton = event.target.closest("[data-copy]");
        if (copyButton) {
          event.preventDefault();
          await copyLink(copyButton);
          return;
        }

        var button = event.target.closest("[data-delete]");
        if (!button) return;

        event.preventDefault();
        status.textContent = "";

        var key = button.getAttribute("data-key");
        var title = button.getAttribute("data-title") || key;

        if (!window.confirm('Delete "' + title + '"?')) return;

        button.disabled = true;

        try {
          // The listing page is itself behind Basic auth, so the browser
          // already has the credentials and attaches them to this request.
          var response = await fetch("/" + encodeURIComponent(key), {
            method: "DELETE"
          });

          if (response.status === 401) {
            status.textContent = "Unauthorized. Reload the page to sign in again.";
            return;
          }

          var data = {};
          try {
            data = await response.json();
          } catch (e) {}

          if (!response.ok) {
            status.textContent = data.error || "Delete failed with status " + response.status;
            return;
          }

          var row = button.closest("li");
          if (row) row.remove();
          updateCount();
        } catch (error) {
          status.textContent = "Network error: " + error.message;
        } finally {
          button.disabled = false;
        }
      });

      localizeDates();
      applyFilter();
    })();
  </script>
</body>
</html>
